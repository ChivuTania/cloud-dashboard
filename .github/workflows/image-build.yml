name: Image build

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      
      - name: Log in Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      
      - name: Log in to the registry
        run: az acr login --name clouddashprodweuacr

      - name: Build and push
        run: |
          LOGIN_SERVER=$(az acr show --name clouddashprodweuacr --query loginServer -o tsv)
          TAG=${GITHUB_SHA::7}
          docker build -t "$LOGIN_SERVER/cloud-dashboard:$TAG" app 
          docker push "$LOGIN_SERVER/cloud-dashboard:$TAG"
          echo "Pushed $LOGIN_SERVER/cloud-dashboard:$TAG"