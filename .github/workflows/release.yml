name: IRelease

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      
      - name: Log in Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      
      - name: Log in to the registry
        run: az acr login --name clouddashprodweuacr

      - name: Build and push version
        id: push
        run: |
          LOGIN_SERVER=$(az acr show --name clouddashprodweuacr --query loginServer -o tsv)
          TAG=${GITHUB_SHA::7}
          IMAGE="$LOGIN_SERVER/cloud-dashboard:$GITHUB_REF_NAME"
          docker build -t $IMAGE app 
          docker push $IMAGE
          echo "Pushed $IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
  
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      
      - name: Deploy the version
        run: |
          az containerapp update \
            --name clouddash-prod-weu-ca \
            --resource-group clouddash-prod-weu-rg \
            --image "${{ needs.build.outputs.image }}" \
            --revision-suffix "${GITHUB_REF_NAME//./-}"