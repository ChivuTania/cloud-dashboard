name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the registry
        run: az acr login --name clouddashprodweuacr

      - name: Build, push, and deploy the version
        run: |
          LOGIN_SERVER=$(az acr show --name clouddashprodweuacr --query loginServer -o tsv)
          IMAGE="$LOGIN_SERVER/cloud-dashboard:$GITHUB_REF_NAME"
          docker build -t "$IMAGE" app
          docker push "$IMAGE"
          az containerapp update \
            --name clouddash-prod-weu-ca \
            --resource-group clouddash-prod-weu-rg \
            --image "$IMAGE" \
            --revision-suffix "${GITHUB_REF_NAME//./-}"